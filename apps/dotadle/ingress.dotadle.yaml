apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dotadle
spec:
  ingressClassName: traefik
  rules:
    - host: dotadle.satyrikon
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dotadle-front
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dotadle-api
                port:
                  number: 80