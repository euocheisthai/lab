apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotadle-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotadle-front
  template:
    metadata:
      labels:
        app: dotadle-front
    spec:
      imagePullSecrets:
        - name: euocheisthai
      containers:
        - name: dotadle-front
          image: euocheisthai/gorldle-front:0.1.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
