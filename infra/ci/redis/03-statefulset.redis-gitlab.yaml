apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-gitlab
  labels:
    app: redis-gitlab
spec:
  serviceName: redis-gitlab
  replicas: 1
  selector:
    matchLabels:
      app: redis-gitlab
  template:
    metadata:
      labels:
        app: redis-gitlab
    spec:
      containers:
        - name: redis
          image: redis:8.8-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "PING"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "PING"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        storageClassName: redis-manual-pvc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
