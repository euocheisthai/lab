apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app: redis-gitlab
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    dir /data
    dbfilename dump.rdb
    appendfilename appendonly.aof