apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv
  labels:
    app: redis-gitlab
spec:
  claimRef:
    name: redis-pvc
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteMany
  storageClassName: redis-manual-pvc
  volumeMode: Filesystem
  hostPath:
    path: "/Volumes/redis/"