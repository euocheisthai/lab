apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-gitlab
spec:
  serviceName: postgres-gitlab
  replicas: 1
  selector:
    matchLabels:
      app: postgres-gitlab
  template:
    metadata:
      labels:
        app: postgres-gitlab
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          env:
            - name: POSTGRES_USER
              value: admuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                # k create secret generic postgres-secret --from-literal=password=<password>
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-pvc
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql
      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
  volumeClaimTemplates:
    - metadata:
        name: postgres-pvc
      spec:
        storageClassName: pg-manual-pvc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
