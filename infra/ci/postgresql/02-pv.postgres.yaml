apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    app: postgres-gitlab
spec:
  capacity:
    storage: 9Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: pg-manual-pvc
  volumeMode: Filesystem # or Block
  hostPath:
    path: "/Volumes/pg/"
  # persistentVolumeReclaimPolicy: Retain
