apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-s3-api
  labels:
    app: garage-s3
  annotations:
    # references use <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: default-garage-s3-cors@kubernetescrd
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  # tls:
  # - hosts:
  #   - s3.storage-nas.satyrikon
  #   secretName: garage-s3-api-tls
  rules:
  - host: s3.storage-nas.satyrikon
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: garage-s3-service
            port:
              number: 3900
