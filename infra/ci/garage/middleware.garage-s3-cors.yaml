apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: garage-s3-cors
  namespace: default
  labels:
    app: garage-s3
spec:
  headers:
    accessControlAllowOriginList:
      - "*"
    accessControlAllowMethods:
      - GET
      - PUT
      - POST
      - DELETE
      - HEAD
      - OPTIONS
    accessControlAllowHeaders:
      - DNT
      - X-CustomHeader
      - Keep-Alive
      - User-Agent
      - X-Requested-With
      - If-Modified-Since
      - Cache-Control
      - Content-Type
      - Authorization
      - x-amz-content-sha256
      - x-amz-date
      - x-amz-security-token
    accessControlExposeHeaders:
      - ETag
      - x-amz-request-id
      - x-amz-id-2
