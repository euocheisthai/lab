apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-admin-api
  labels:
    app: garage-s3
  # annotations:
  #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  # tls:
  # - hosts:
  #   - admin.storage-nas.satyrikon
  #   secretName: garage-admin-tls
  rules:
  - host: admin.storage-nas.satyrikon
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: garage-s3-service
            port:
              number: 3903
