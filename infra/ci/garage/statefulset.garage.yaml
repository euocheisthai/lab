apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage-s3-storage
  labels:
    app: garage-s3
spec:
  serviceName: garage-s3-service
  replicas: 1
  selector:
    matchLabels:
      app: garage-s3
  template:
    metadata:
      labels:
        app: garage-s3

    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.5.0
          imagePullPolicy: IfNotPresent
          command: ["/garage"]
          args: ["server", "--single-node", "--default-bucket"]
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          ports:
            - containerPort: 3900
              name: s3-api
              protocol: TCP
            - containerPort: 3901
              name: rpc
              protocol: TCP
            - containerPort: 3902
              name: web
              protocol: TCP
            - containerPort: 3903
              name: admin
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "garage=info"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets-admintoken
                  key: admin_token
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-secrets-rpctoken
                  key: rpc_secret
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-secrets-metricstoken
                  key: metrics_token
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secrets-acckey
                  key: default-access-key
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secrets-seckey
                  key: default-secret-key
            - name: GARAGE_DEFAULT_BUCKET
              value: "bucket-main"
          livenessProbe:
            httpGet:
              path: /health
              port: 3903
              httpHeaders:
                - name: Authorization
                  value: "Bearer 6c187938886bd094d6b4506eef480edf"
                  # valueFrom:
                  #   secretKeyRef:
                  #     name: garage-secrets
                  #     key: authorization-token
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: garage-pvc
              mountPath: /mnt/
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: garage.toml
      volumes:
        - name: garage-config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: garage-pvc
      spec:
        storageClassName: garage-manual-pvc
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi