helmBinary: /usr/bin/helm

repositories:
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    set:
      - name: prometheus.enabled
        value: true
      - name: crds.enabled
        value: true
