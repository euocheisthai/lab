apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-routing
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: registry.satyrikon
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-registry
            port:
              number: 5000
